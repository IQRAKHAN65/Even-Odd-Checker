<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Even Odd Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

       <h1>Even or Odd?🌸</h1>

<p class="subtitle">
     Let's find out together!🌈
</p>

<p class="description">
    Enter a number below and I'll tell you if it's even or odd.
</p>

        <input type="number" id="numberInput" placeholder="Enter a number">

       <button id="checkBtn">Check Number</button>

<div id="result" style="margin-bottom: 25px;"></div>

<button id="resetBtn" style="width: 130px !important; height: 50px; display: block; margin: 0 auto; padding: 0; background: #f3a6c8; border-radius: 15px;">
    🔄 Reset
</button>


    </div>

    <script src="script.js"></script>

</body>
</html>
